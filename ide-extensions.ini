[vscode]
# Open VSX extension identifiers installed by code-server.
# Python support: https://open-vsx.org/extension/ms-python/python
# Jupyter notebook support: https://open-vsx.org/extension/ms-toolsai/jupyter
# --- PRODUCTIVITY ---
# Python code formatter, https://open-vsx.org/extension/ms-python/black-formatter
# Better coloured Comments: https://open-vsx.org/extension/aaron-bond/better-comments
# Auto-generate Python Docstring, https://open-vsx.org/extension/njpwerner/autodocstring
# GitLens (Visualize code authorship): https://open-vsx.org/extension/eamodio/gitlens
# --- AI CODE ASSISTANTS ---
# Continue.dev - open-source AI code agent, https://open-vsx.org/extension/Continue/continue
# OpenChamber - OpenCode AI coding agent in your editor, https://open-vsx.org/extension/FedaykinDev/openchamber
ms-python.python
ms-toolsai.jupyter
ms-python.black-formatter
aaron-bond.better-comments
njpwerner.autodocstring
eamodio.gitlens
Continue.continue
fedaykindev.openchamber

[jupyterlab]
# PyPI requirements for prebuilt JupyterLab extensions, installed with pip3.
# Example:
# jupyterlab-git>=0.50
# ---
# Extended support for Git - https://github.com/jupyterlab/jupyterlab-git
# Access GitHub repositories - https://github.com/jupyterlab/jupyterlab-github
# Jupyter Real-Time Collaboration - https://github.com/jupyterlab/jupyter-collaboration
# Extension to support copy/paste in TUI - https://github.com/stellarshenson/jupyterlab_terminal_clipboard_extension
jupyterlab-git
jupyterlab-github
jupyter-collaboration>=3.0
jupyterlab-terminal-clipboard-extension

